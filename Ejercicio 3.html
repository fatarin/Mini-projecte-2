<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title></title>
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.0/css/bootstrap.min.css" integrity="sha384-9gVQ4dYFwwWSjIDZnLEWnxCjeSWFphJiwGPXr1jddIhOegiu1FwO5qRGvFXOdJZ4" crossorigin="anonymous">
    <script>
        window.onload = function() {
          // Variables
          const baseDeDatos = [
              {
                  id: 1,
                  nombre: 'Patata',
                  precio: 1,
                  imagen: 'patata.jpg'
              },
              {
                  id: 2,
                  nombre: 'Cebolla',
                  precio: 1.2,
                  imagen: 'cebolla.jpg'
              },
              {
                  id: 3,
                  nombre: 'Calabacin',
                  precio: 2.1,
                  imagen: 'calabacin.jpg'
              },
              {
                  id: 4,
                  nombre: 'Fresas',
                  precio: 0.6,
                  imagen: 'fresas.jpg'
              }

          ];

          const divisa = '€';
          const DOMitems = document.querySelector('#items');
          const listaCarrito = [];

          // Funciones

          /**
          * Dibuja todos los productos a partir de la base de datos. No confundir con el carrito
          */
          function renderizarProductos() {
              baseDeDatos.forEach((info) => {
                  // Estructura
                  const miNodo = document.createElement('div');
                  miNodo.classList.add('card', 'col-sm-4');
                  // Body
                  const miNodoCardBody = document.createElement('div');
                  miNodoCardBody.classList.add('card-body');
                  // Titulo
                  const miNodoTitle = document.createElement('h5');
                  miNodoTitle.classList.add('card-title');
                  miNodoTitle.textContent = info.nombre;
                  // Imagen
                  const miNodoImagen = document.createElement('img');
                  miNodoImagen.classList.add('img-fluid');
                  miNodoImagen.setAttribute('src', info.imagen);
                  // Precio
                  const miNodoPrecio = document.createElement('p');
                  miNodoPrecio.classList.add('card-text');
                  miNodoPrecio.textContent = `${info.precio}${divisa}`;
                  // Boton 
                  const miNodoBoton = document.createElement('button');
                  miNodoBoton.classList.add('btn', 'btn-primary');
                  miNodoBoton.textContent = '+';
                  miNodoBoton.setAttribute('marcador', info.id);
                  //miNodoBoton.addEventListener('click', anyadirProductoAlCarrito); Esto venía en plantilla ejercicio, quitamos y añadimos los eventos manualmente
                  /*añadimos boton - */
                  const miNodoBotonMenos = document.createElement('button');
                  miNodoBotonMenos.classList.add('btn', 'btn-secondary');
                  miNodoBotonMenos.disabled = true;
                  miNodoBotonMenos.textContent = '-';
                  miNodoBotonMenos.setAttribute('marcador', info.id);
                  miNodoBotonMenos.id = info.nombre;    //añadido id on nombre producto para control en borrarlinea()
                  
                  // Insertamos
                  miNodoCardBody.appendChild(miNodoImagen);
                  miNodoCardBody.appendChild(miNodoTitle);
                  miNodoCardBody.appendChild(miNodoPrecio);
                  miNodoCardBody.appendChild(miNodoBoton);
                  miNodoCardBody.appendChild(miNodoBotonMenos);
                  miNodo.appendChild(miNodoCardBody);
                  DOMitems.appendChild(miNodo);
              });
          }

          // Inicio
          renderizarProductos();



          /*============ AÑADIR EVENTO A BOTON X ================*/
          //capturar todos los botones x
          
          function borrarLinea() {
                let botonBorrarLinea = Array.from(document.getElementsByName('borrar_fila'));
                console.log('borrarfila', botonBorrarLinea);
                botonBorrarLinea.forEach((elemento) => {
                    elemento.addEventListener('click', () => {

                        //deshabilitar boton - de card correspondiente a producto eliminado del carrito
                        let nombreX = listaCarrito[elemento.id];   //recogemos el nombre de producto de la linea eliminada al pusar botón
                        
                        let botonDeshabilitar = document.getElementById(nombreX.nombre);  //el botón - que coincide id con nombre elmento borrado en lista carrito
                        botonDeshabilitar.disabled = true;
                        
                        



                        //borramos del array la posicion identificada con indice en que se ha creado boton X
                        //console.log('id', elemento.id);
                        
                        listaCarrito.splice([parseInt(elemento.id)], 1);


                        actualizaCarrito();
                        
                    });
                });
            };

          //funcion para recorrer y mostrar datos acumulados en listaCarrito
          function actualizaCarrito(){
            //console.log('entrado en actualizaCarrito');
            //recoger ul
            let listaElementos = document.getElementById('carrito');
            //inicializar listado
            listaElementos.innerHTML = "";
            //console.log('lista: ' , listaElementos);

            //variable para almacenar Total
            let importeTotal = 0;
            //recorrer listaCarrito y añadir html a carrito(ul)
            listaCarrito.forEach((elemento, indice) => {
                listaElementos.innerHTML += `<li>${elemento.cantidad} - ${elemento.nombre} ${elemento.precio}<button name="borrar_fila" class="primary" id=${indice}>X</button></li>`;  //establecemos id con el indice asignado al añadir al array para controles en eventos
                //calcular importe total acumulando cantidad * precio
                importeTotal += parseInt(elemento.cantidad) * parseFloat(elemento.precio);
          

            });
            
            //añadir evento al boton x creado
            borrarLinea();
            //cargar importe calculado en id="total"
             document.getElementById('total').textContent = importeTotal.toFixed(2);
          };

          //añadir productos (objeto) en array listaCarrito
            function anyadirProductoAlCarrito(nombre, precio) {
                        console.log('lista carrito: ', listaCarrito);
                        //console.log('nombre recibido: ', nombre);
                        //console.log('precio recibido: ', precio);
                        
                        let nuevoObjeto = {
                            nombre: nombre,
                            precio: precio,
                            cantidad: 1
                        };
                        //console.log('nuevo objeto: ', nuevoObjeto);
                        // COMPROBAR SI EXISTE
                        
                        let existe = listaCarrito.find(elemento => elemento.nombre === nuevoObjeto.nombre);
                        let posicionModificar = listaCarrito.findIndex(elemento => elemento.nombre === nuevoObjeto.nombre);
                        //console.log('posicion', posicionModificar);
                        //console.log('existe', existe);
                        if(existe){
                            listaCarrito[posicionModificar].cantidad ++;
                            
                        } else{
                            listaCarrito.push(nuevoObjeto);
                        }
                        console.log('lista actualizada' , listaCarrito);
                        actualizaCarrito();
            };

        /*===============   AÑADIR EVENTO A BOTON + ====================*/
            //recoger botones +
            let botonMas = Array.from(document.getElementsByClassName('btn-primary'));
            //console.log(botonMas);
            //recorrer botones
            botonMas.forEach((elemento) => {
                //añadir evento
                elemento.addEventListener('click', () => {
                    console.log('boton pulsado');
                    //recoger nombre
                    let nombreProducto = elemento.previousElementSibling.previousElementSibling.textContent;
                    console.log('nombre pulsado: ', nombreProducto);

                    //recoger precio
                    let precioProducto = elemento.previousElementSibling.textContent;
                    console.log('precio pulsado: ', precioProducto);

                    anyadirProductoAlCarrito(nombreProducto, precioProducto);


                    /*====== habilitar boton - ===============*/
                    elemento.nextElementSibling.removeAttribute('disabled');

                });
            });

            /*============AÑADIR EVENTO A BOTON - ===========================*/
            let botonMenos = Array.from(document.getElementsByClassName('btn-secondary'));
            botonMenos.forEach((elemento) => {
                elemento.addEventListener('click', () => {
                    let nombreProducto = elemento.previousElementSibling.previousElementSibling.previousElementSibling.textContent;
                    
                    let elementoRestar = listaCarrito.findIndex(elemento => elemento.nombre === nombreProducto);
                    listaCarrito[elementoRestar].cantidad -= 1;
                    if (listaCarrito[elementoRestar].cantidad == 0){
                        listaCarrito.splice(elementoRestar, 1);
                        elemento.disabled = true;
                    };
                   
                    actualizaCarrito();
                });
                
            });


            
       /*================== AÑADIR EVENTO A BOTON VACIAR ===========================*/
       document.getElementById('boton-vaciar').addEventListener('click', () => {
            console.log('vaciar');
            //borrar array
            //listaCarrito.length = 0;
            //otra alternativa de borrado
            listaCarrito.splice(0);
            actualizaCarrito();
       });

        };

        


    </script>
</head>
<body>
    <div class="container">
        <div class="row">
            <div id="items" class="col-sm-8 row">
            </div>
            <!-- Carrito -->
            <div class="col-sm-4">
                <h2>Carrito</h2>
                <!-- Elementos del carrito -->
                <ul id="carrito" class="list-group"></ul>
                <hr>
                <!-- Precio total -->
                <p class="text-right">Total: <span id="total"></span>&euro;</p>
                <button id="boton-vaciar" class="btn btn-danger">Vaciar</button>
            </div>
        </div>
    </div>
</body>
</html>
