<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title></title>
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.0/css/bootstrap.min.css" integrity="sha384-9gVQ4dYFwwWSjIDZnLEWnxCjeSWFphJiwGPXr1jddIhOegiu1FwO5qRGvFXOdJZ4" crossorigin="anonymous">
    <script>
        window.onload = function() {
          // Variables
          const baseDeDatos = [
              {
                  id: 1,
                  nombre: 'Patata',
                  precio: 1,
                  imagen: 'patata.jpg'
              },
              {
                  id: 2,
                  nombre: 'Cebolla',
                  precio: 1.2,
                  imagen: 'cebolla.jpg'
              },
              {
                  id: 3,
                  nombre: 'Calabacin',
                  precio: 2.1,
                  imagen: 'calabacin.jpg'
              },
              {
                  id: 4,
                  nombre: 'Fresas',
                  precio: 0.6,
                  imagen: 'fresas.jpg'
              }

          ];

          const divisa = '€';
          const DOMitems = document.querySelector('#items');
          const listaCarrito = [];

          // Funciones

          /**
          * Dibuja todos los productos a partir de la base de datos. No confundir con el carrito
          */
          function renderizarProductos() {
              baseDeDatos.forEach((info) => {
                  // Estructura
                  const miNodo = document.createElement('div');
                  miNodo.classList.add('card', 'col-sm-4');
                  // Body
                  const miNodoCardBody = document.createElement('div');
                  miNodoCardBody.classList.add('card-body');
                  // Titulo
                  const miNodoTitle = document.createElement('h5');
                  miNodoTitle.classList.add('card-title');
                  miNodoTitle.textContent = info.nombre;
                  // Imagen
                  const miNodoImagen = document.createElement('img');
                  miNodoImagen.classList.add('img-fluid');
                  miNodoImagen.setAttribute('src', info.imagen);
                  // Precio
                  const miNodoPrecio = document.createElement('p');
                  miNodoPrecio.classList.add('card-text');
                  miNodoPrecio.textContent = `${info.precio}${divisa}`;
                  // Boton 
                  const miNodoBoton = document.createElement('button');
                  miNodoBoton.classList.add('btn', 'btn-primary');
                  miNodoBoton.textContent = '+';
                  miNodoBoton.setAttribute('marcador', info.id);
                  //miNodoBoton.addEventListener('click', anyadirProductoAlCarrito);
                  // Insertamos
                  miNodoCardBody.appendChild(miNodoImagen);
                  miNodoCardBody.appendChild(miNodoTitle);
                  miNodoCardBody.appendChild(miNodoPrecio);
                  miNodoCardBody.appendChild(miNodoBoton);
                  miNodo.appendChild(miNodoCardBody);
                  DOMitems.appendChild(miNodo);
              });
          }

          // Inicio
          renderizarProductos();

          //funcion para recorrer y mostrar datos acumulados en listaCarrito
          function actualizaCarrito(){
            //console.log('entrado en actualizaCarrito');
            //recoger ul
            let listaElementos = document.getElementById('carrito');
            //inicializar listado
            listaElementos.innerHTML = "";
            //console.log('lista: ' , listaElementos);
            //recorrer listaCarrito y añadir html a carrito(ul)
            listaCarrito.forEach((elemento) => {
                listaElementos.innerHTML += `<li>${elemento.cantidad} - ${elemento.nombre} ${elemento.precio}<button class="primary">X</button></li>`;
            });
          };

          //añadir productos (objeto) en array listaCarrito
            function anyadirProductoAlCarrito(nombre, precio) {
                        //console.log('lista carrito: ', listaCarrito);
                        //console.log('nombre recibido: ', nombre);
                        //console.log('precio recibido: ', precio);
                        
                        let nuevoObjeto = {
                            nombre: nombre,
                            precio: precio,
                            cantidad: 1
                        };
                        //console.log('nuevo objeto: ', nuevoObjeto);
                        // FALTA COMPROBAR SI EXISTE
                        listaCarrito.push(nuevoObjeto);
                        console.log('lista actualizada' , listaCarrito);
                        actualizaCarrito();
            };

        /*===============   AÑADIR EVENTO A BOTON + ====================*/
            //recoger botones +
            let botonMas = Array.from(document.getElementsByClassName('btn'));
            //console.log(botonMas);
            //recorrer botones
            botonMas.forEach((elemento) => {
                //añadir evento
                elemento.addEventListener('click', () => {
                    console.log('boton pulsado');
                    //recoger nombre
                    let nombreProducto = elemento.previousElementSibling.previousElementSibling.textContent;
                    console.log('nombre pulsado: ', nombreProducto);

                    //recoger precio
                    let precioProducto = elemento.previousElementSibling.textContent;
                    console.log('precio pulsado: ', precioProducto);

                    anyadirProductoAlCarrito(nombreProducto, precioProducto);

                });
            });
            
       

        };

        


    </script>
</head>
<body>
    <div class="container">
        <div class="row">
            <div id="items" class="col-sm-8 row">
            </div>
            <!-- Carrito -->
            <div class="col-sm-4">
                <h2>Carrito</h2>
                <!-- Elementos del carrito -->
                <ul id="carrito" class="list-group"></ul>
                <hr>
                <!-- Precio total -->
                <p class="text-right">Total: <span id="total"></span>&euro;</p>
                <button id="boton-vaciar" class="btn btn-danger">Vaciar</button>
            </div>
        </div>
    </div>
</body>
</html>
